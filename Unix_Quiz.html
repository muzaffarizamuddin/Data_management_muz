            color: var(--text-color);
            margin-bottom: 10px;
            font-weight: 800;

        }

            font-size: 1.1rem;
            color: var(--subtitle-color);
            margin: 0 auto;
        }

        .quiz-grid {
            display: flex;
            flex-direction: column; 
            gap: 20px;
            width: 100%;
        }

        /* CHANGED: Cards now expand to take 100% of the container width safely */
        .quiz-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            width: 100%;

            flex-direction: column;
            justify-content: space-between;

        .quiz-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        .quiz-badge {
            display: inline-block;
            align-self: flex-start;
            background-color: #eff6ff;
            color: var(--primary-color);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
        }

        .quiz-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--text-color);
        }

        .quiz-description {
            color: var(--subtitle-color);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .launch-btn {
            display: block;
            text-align: center;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 8px;
            transition: background-color 0.15s ease;
        }

        .launch-btn:hover {
            background-color: var(--primary-hover);
        }

        .quiz-card.placeholder {
            border-style: dashed;
            background: transparent;
            box-shadow: none;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0.6;
            padding: 30px;
        }

        .placeholder-text {
            color: #94a3b8;
            font-weight: 500;
        }
    </style>
</head>

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            quizData.questions.forEach((q, qIdx) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.setAttribute('data-qidx', qIdx);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerText = q.questionNumber + ". " + q.question;
                card.appendChild(qText);

                const optsList = document.createElement('ul');
                optsList.className = 'options-list';

                q.answerOptions.forEach((opt, oIdx) => {
                    const li = document.createElement('li');
                    li.className = 'option-item';
                    li.innerText = opt.text;
                    li.onclick = () => selectOption(qIdx, oIdx, li);
                    optsList.appendChild(li);
                });

                card.appendChild(optsList);

                const ratBox = document.createElement('div');
                ratBox.className = 'rationale';
                ratBox.id = `rat-${qIdx}`;
                card.appendChild(ratBox);

                container.appendChild(card);
            });
        }

        let selections = {};

        function selectOption(qIdx, oIdx, element) {
            const card = document.querySelector(`[data-qidx="${qIdx}"]`);
            card.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selections[qIdx] = oIdx;
        }

        function gradeQuiz() {
            let correctCount = 0;
            quizData.questions.forEach((q, qIdx) => {
                const ratBox = document.getElementById(`rat-${qIdx}`);
                const selectedOIdx = selections[qIdx];
                
                if (selectedOIdx === undefined) {
                    ratBox.className = 'rationale incorrect';
                    ratBox.innerHTML = '<strong>Not Answered.</strong> Please pick an option.';
                    ratBox.style.display = 'block';
                    return;
                }

                const chosenOpt = q.answerOptions[selectedOIdx];
                const correctOptIndex = q.answerOptions.findIndex(o => o.isCorrect);
                const correctOpt = q.answerOptions[correctOptIndex];

                if (chosenOpt.isCorrect) {
                    correctCount++;
                    ratBox.className = 'rationale correct';
                    ratBox.innerHTML = '<strong>Correct!</strong> ' + chosenOpt.rationale;
                } else {
                    ratBox.className = 'rationale incorrect';
                    ratBox.innerHTML = '<strong>Incorrect.</strong> You chose ' + chosenOpt.text + '. <br><em>Correct Answer:</em> ' + correctOpt.text + ' — ' + correctOpt.rationale;
                }
                ratBox.style.display = 'block';
            });

            const scoreBanner = document.getElementById('scoreBanner');
            scoreBanner.innerText = `Quiz Complete! You scored ${correctCount} / ${quizData.questions.length} (${Math.round((correctCount/quizData.questions.length)*100)}%)`;
            scoreBanner.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
